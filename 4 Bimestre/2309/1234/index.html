
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px #00000040;
        }

        h1 {
            text-align: center;
            color: #243b55;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #537fe7;
            border-color: transparent;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #3157a4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #243b75;
        }

        #resultado {
            margin-top: 20px;
            color: #167443;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Novo Cadastro</h1>
        <p>Preencha seus dados abaixo</p>

        <form id="formCadastro">
            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                required
            >

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="exemplo@email.com"
                required
            >

            <label for="idade">Idade</label>
            <input
                type="number"
                id="idade"
                name="idade"
                placeholder="Digite sua idade"
                min="1"
                max="120"
                required
            >

            <button type="submit">Cadastrar</button>
        </form>

        <div id="resultado" aria-live="polite"></div>
    </div>

    <script>
        function cadastrarUsuario(event) {
            event.preventDefault();

            const formulario = event.target;
            const dados = Object.fromEntries(
                new FormData(formulario)
            );

            console.log("Dados cadastrados:", dados);
            console.log("Nome:", dados.nome);
            console.log("E-mail:", dados.email);
            console.log("Idade:", dados.idade);

            document.getElementById("resultado").textContent =
                "Cadastro realizado com sucesso, " + dados.nome + "!";

            formulario.reset();
        }

        const formulario = document.getElementById("formCadastro");

        formulario.addEventListener("submit", cadastrarUsuario);
    </script>

</body>
</html>
