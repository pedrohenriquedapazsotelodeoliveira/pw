
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>

    <link rel="stylesheet" href="estilo.css">

    <script src="script.js" defer></script>
</head>

<body>

    <header class="cabecalho">
        <div class="icone">✦</div>
        <h1>Cadastro de Usuário</h1>
        <p>Preencha seus dados para criar sua conta</p>
    </header>

    <main class="container">

        <form id="formCadastro">

            <div class="secao-titulo">
                <span>01</span>
                <h2>Dados pessoais</h2>
            </div>

            <div class="campo">
                <label for="nome">Nome completo *</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="dataNascimento">Nascimento *</label>
                    <input
                        type="date"
                        id="dataNascimento"
                        name="dataNascimento"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="idade">Idade *</label>
                    <input
                        type="number"
                        id="idade"
                        name="idade"
                        min="1"
                        max="120"
                        placeholder="Sua idade"
                        required
                    >
                </div>
            </div>

            <div class="campo">
                <label for="sexo">Sexo</label>
                <select id="sexo" name="sexo">
                    <option value="">Selecione uma opção</option>
                    <option value="Feminino">Feminino</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Outro">Outro</option>
                    <option value="Prefiro não informar">
                        Prefiro não informar
                    </option>
                </select>
            </div>

            <div class="secao-titulo">
                <span>02</span>
                <h2>Contato e acesso</h2>
            </div>

            <div class="campo">
                <label for="email">E-mail *</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="exemplo@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="campo">
                <label for="telefone">Telefone *</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(11) 99999-9999"
                    autocomplete="tel"
                    required
                >
            </div>

            <div class="campo">
                <label for="senha">Senha *</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Mínimo de 6 caracteres"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >
                <small>Use pelo menos 6 caracteres.</small>
            </div>

            <div class="campo">
                <label for="confirmarSenha">Confirmar senha *</label>
                <input
                    type="password"
                    id="confirmarSenha"
                    name="confirmarSenha"
                    placeholder="Digite a senha novamente"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="secao-titulo">
                <span>03</span>
                <h2>Endereço</h2>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="cep">CEP</label>
                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        placeholder="00000-000"
                        autocomplete="postal-code"
                    >
                </div>

                <div class="campo">
                    <label for="numero">Número</label>
                    <input
                        type="text"
                        id="numero"
                        name="numero"
                        placeholder="Nº da residência"
                    >
                </div>
            </div>

            <div class="campo">
                <label for="endereco">Rua ou avenida</label>
                <input
                    type="text"
                    id="endereco"
                    name="endereco"
                    placeholder="Nome da rua"
                    autocomplete="street-address"
                >
            </div>

            <div class="campo">
                <label for="complemento">Complemento</label>
                <input
                    type="text"
                    id="complemento"
                    name="complemento"
                    placeholder="Apartamento, bloco etc."
                >
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="bairro">Bairro</label>
                    <input
                        type="text"
                        id="bairro"
                        name="bairro"
                        placeholder="Seu bairro"
                    >
                </div>

                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        placeholder="Sua cidade"
                        autocomplete="address-level2"
                    >
                </div>
            </div>

            <div class="campo">
                <label for="estado">Estado</label>
                <select id="estado" name="estado">
                    <option value="">Selecione seu estado</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
            </div>

            <div class="campo">
                <label for="observacoes">Observações</label>
                <textarea
                    id="observacoes"
                    name="observacoes"
                    rows="4"
                    placeholder="Escreva algo, se desejar..."
                ></textarea>
            </div>

            <div class="termos">
                <label for="aceitaTermos">
                    <input
                        type="checkbox"
                        id="aceitaTermos"
                        name="aceitaTermos"
                        required
                    >
                    <span>Confirmo que revisei os dados informados.</span>
                </label>
            </div>

            <div class="botoes">
                <button type="submit" class="btn-cadastrar">
                    <span>✦</span> Criar cadastro
                </button>

                <button type="reset" class="btn-limpar">
                    Limpar campos
                </button>
            </div>

            <p class="aviso">* Campos obrigatórios</p>

        </form>

        <section id="painelResultado" class="resultado" hidden>
            <div class="sucesso-icone">✓</div>
            <h2>Cadastro realizado!</h2>
            <p id="resultado"></p>
            <button type="button" id="novoCadastro" class="btn-cadastrar">
                Novo cadastro
            </button>
        </section>

        <footer>
            <p>Cadastro de Usuário · Projeto de aprendizagem</p>
        </footer>

    </main>

</body>
</html>
